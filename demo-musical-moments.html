  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  var QRMode = {

    PATTERN101 : 5,

  };

<style>
:root{
  --violet:#5B3E7E; --violet-d:#3B2556; --violet-dd:#24163a;

  --free:#fff; --sold:#C9C1D6; --hold:#F5C33B; --mine:#5B3E7E; --cash:#E9A8C4; --ok:#2E9E6A; --bad:#D2455B;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}

.demo-bar{background:var(--violet-dd);color:#E8DFF7;font-size:13px;text-align:center;padding:6px 12px;letter-spacing:.3px}
.demo-bar b{color:var(--yellow)}
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top-in img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--lav-2)}
.brand{flex:1;line-height:1.1}
.brand b{font-family:Fredoka;font-size:17px;color:var(--violet-d)}
.brand small{display:block;color:var(--muted);font-size:12px}
.switch{display:flex;background:var(--lav);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px;color:var(--violet)}
.switch button.on{background:var(--violet);color:#fff}
main{max-width:1080px;margin:0 auto;padding:16px 16px 120px}
.hidden{display:none!important}

/* Hero */
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;min-height:230px;display:flex;align-items:flex-end;background:#140b22}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.08)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,22,58,.15) 0%,rgba(36,22,58,.55) 45%,rgba(36,22,58,.95) 100%)}
.hero .in{position:relative;z-index:1;padding:22px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(245,195,59,.95);color:var(--violet-dd);font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.hero h1{font-size:34px;margin:10px 0 4px;line-height:1.05}
.hero p{margin:0;opacity:.9;font-size:15px}
.star{color:var(--yellow)}

/* Cartelera */
.section-t{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.section-t h2{font-size:22px;color:var(--violet-d)}
.section-t span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.show{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 20px rgba(59,37,86,.07);display:flex;flex-direction:column}
.show .pic{height:150px;position:relative;background:linear-gradient(135deg,var(--violet),var(--violet-dd))}
.show{cursor:pointer;transition:transform .15s,box-shadow .15s}.show:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(59,37,86,.14)}
.show .pic{height:170px}.show .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(36,22,58,.8))}
.show .pic .tag{position:absolute;left:12px;top:12px;z-index:1}
.show .pic .grp{position:absolute;left:14px;bottom:10px;z-index:1;color:#fff;font-weight:800;font-size:13px;letter-spacing:.3px}
.show .pic.soon{background:repeating-linear-gradient(45deg,#E7E0F3 0 14px,#EFEAF8 14px 28px)}
.show .pic.soon .grp{color:var(--violet-d)}
.show .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.show h3{font-size:19px;color:var(--ink)}
.meta{color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;background:var(--violet);color:#fff;transition:transform .08s, background .2s}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--yellow);color:var(--violet-dd)}
.btn.ghost{background:var(--lav);color:var(--violet)}
.btn:disabled{background:#CFC8DA;color:#fff;cursor:not-allowed}
.btn.full{width:100%}
.soon-l{color:var(--muted);font-size:13px;font-weight:700;margin-top:auto}

/* Stepper */
.backlink{border:0;background:none;color:var(--violet);font-weight:800;padding:4px 0;margin-bottom:8px;font-size:14px}
.stepper{display:flex;gap:6px;margin:12px 0 12px}
.stepper div{flex:1;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.stepper div i{display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:6px}
.stepper div.on{color:var(--violet)} .stepper div.on i{background:var(--violet)}
.stepper div.done i{background:var(--yellow)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 6px 20px rgba(59,37,86,.06)}
.panel h2{font-size:21px;color:var(--violet-d);margin-bottom:4px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}

.funcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.func{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;text-align:left;display:flex;gap:14px;align-items:center}
.func:hover{border-color:var(--lav-2)}
.func .cal{background:var(--violet);color:#fff;border-radius:12px;width:58px;text-align:center;padding:6px 0;flex:none}
.func .cal b{display:block;font-family:Fredoka;font-size:24px;line-height:1}
.func .cal small{font-size:11px;font-weight:800;text-transform:uppercase}
.func .info b{font-size:16px;display:block}
.func .avail{font-size:14px;color:var(--ok);font-weight:800}
.func .avail.low{color:var(--bad)}

/* Seat map */
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:14px;color:var(--muted);margin:4px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--lav-2);display:inline-block}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:14px;background:#FBFAFE;overflow:auto;max-height:62vh;touch-action:pan-x pan-y}
.zoom{display:flex;gap:6px;justify-content:flex-end;margin:0 0 8px}
.zoom button{min-width:44px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:800;color:var(--violet);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.map{--s:20px;padding:12px 8px 14px;width:max-content;margin:0 auto}
.stage{background:var(--violet-d);color:#fff;text-align:center;font-family:Fredoka;letter-spacing:4px;font-size:13px;padding:6px;border-radius:0 0 40px 40px;margin:0 auto 14px;width:70%}
.row{display:flex;align-items:center;gap:calc(var(--s) * .15);margin-bottom:calc(var(--s) * .15)}
.row .lbl{width:calc(var(--s) * .9);text-align:center;font-size:calc(var(--s) * .5);font-weight:800;color:var(--muted);flex:none}
.side{display:flex;gap:calc(var(--s) * .15)}
.side.l{justify-content:flex-end;width:calc(var(--s) * 1.15 * 14)}
.side.r{justify-content:flex-start;width:calc(var(--s) * 1.15 * 14)}
.aisle{width:calc(var(--s) * 1.4);flex:none}
.seat{width:var(--s);height:var(--s);border-radius:calc(var(--s) * .28) calc(var(--s) * .28) calc(var(--s) * .14) calc(var(--s) * .14);border:max(1px,calc(var(--s) * .08)) solid #B9ABD4;background:var(--free);padding:0;font-size:calc(var(--s) * .36);letter-spacing:-.3px;line-height:1;font-weight:800;color:transparent;white-space:nowrap;overflow:hidden;flex:none;position:relative;transition:background .25s,border-color .25s,transform .1s}
.seat.s2{border-color:#E3A3BF;background:#FFF5F9}
.seat:disabled{pointer-events:none}.seat,.mapwrap,.zoom button{touch-action:manipulation}.seat:hover:not(:disabled){transform:scale(1.15);z-index:2}
.seat.sold,.seat.cash{background:var(--sold);border-color:var(--sold);cursor:not-allowed}
.seat.hold{background:var(--hold);border-color:var(--yellow-d);animation:pulse 1s ease-in-out infinite}
.seat.mine{background:var(--mine);border-color:var(--violet-d);color:#fff}
.seat.held{background:var(--mine);border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.seat.pick{background:#7CC5A0;border-color:#2E9E6A}
.seat.flash{animation:flash .7s 3}
@keyframes pulse{50%{filter:brightness(1.12);transform:scale(1.08)}}
@keyframes flash{50%{background:var(--bad);border-color:var(--bad)}}
.s2band{text-align:center;margin:6px 0 6px;font-size:13px;font-weight:800;color:#B0507A;letter-spacing:.5px}
.wc{display:flex;justify-content:space-between;margin-top:8px;font-size:calc(var(--s) * .8);color:var(--violet)}
.price-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--lav)}
.price-row b{font-family:Fredoka;font-size:20px;color:var(--violet-d)}
.price-row small{display:block;color:var(--muted);font-weight:700}

/* Sticky cart */
.cart{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(59,37,86,.1);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.cart-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cart .sum{flex:1;line-height:1.2}
.cart .sum b{font-family:Fredoka;font-size:24px;color:var(--violet-d)}
.cart .sum small{display:block;color:var(--ink);font-size:15px;font-weight:700;margin-bottom:2px}.cart .sum .cnt{display:block;color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.timer{display:inline-flex;align-items:center;gap:6px;background:#FFF4D6;color:#8A6500;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;margin-bottom:12px}

/* Forms */
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
label.f small{font-weight:600;color:var(--muted)}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--lav)}
.recap{border:1px dashed var(--lav-2);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.recap div{display:flex;justify-content:space-between;padding:3px 0}
.recap .t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}

/* MP mock */
.mp{border-radius:16px;overflow:hidden;border:1px solid #DDE6F3;background:#fff;max-width:440px;margin:0 auto}
.mp .h{background:#009EE3;color:#fff;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.mp .h small{font-weight:700;opacity:.85}
.mp .b{padding:16px}
.mp .opt{display:flex;align-items:center;gap:10px;border:1.5px solid #DDE6F3;border-radius:12px;padding:12px;margin-bottom:8px;font-weight:700}
.mp .opt.on{border-color:#009EE3;background:#F0F9FE}
.mp .opt i{width:18px;height:18px;border-radius:50%;border:2px solid #9BB3CF;flex:none}
.mp .opt.on i{border:5px solid #009EE3}
.mp .btn{background:#009EE3}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* Tickets */
.ok-head{text-align:center;padding:6px 0 10px}
.ok-head .big{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 10px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.ticket{background:linear-gradient(160deg,var(--violet),var(--violet-dd));color:#fff;border-radius:18px;padding:16px;position:relative;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--bg);top:58%}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.ticket .tt{font-family:Fredoka;font-size:18px}
.ticket .tm{font-size:14px;opacity:.85}
.ticket .seatbig{font-family:Fredoka;font-size:30px;color:var(--yellow);margin:8px 0 2px}
.ticket .qr{background:#fff;border-radius:12px;padding:10px;display:flex;align-items:center;gap:12px;margin-top:16px;color:var(--ink)}
.ticket .qr .q{width:84px;height:84px;flex:none;display:grid;place-items:center}
.ticket .qr .q svg{width:84px;height:84px;display:block}
.ticket .code{font-family:Fredoka;font-size:30px;letter-spacing:6px;color:var(--violet-d)}
.ticket .code-l{font-size:12px;color:var(--muted);font-weight:800}

/* Admin */
.tabs{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;color:var(--violet);font-size:13px}
.tabs button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--muted);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-family:Fredoka;font-size:26px;color:var(--violet-d);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .bar{height:8px;background:var(--lav);border-radius:6px;margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--violet);border-radius:6px;transition:width .5s}
.kpi .hint{font-size:13px;color:var(--muted);font-weight:700}
.cols{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}.cols>*{min-width:0}
@media(min-width:900px){.cols{grid-template-columns:1.4fr 1fr}}
.artist{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.artist .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist .b{height:12px;background:var(--lav);border-radius:6px;overflow:hidden}
.artist .b i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#8A63B8);border-radius:6px;transition:width .5s}
.artist .c{text-align:right;font-weight:800;color:var(--violet-d);font-variant-numeric:tabular-nums}
.feed{max-height:280px;overflow:auto}
.feed div{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.feed div span{color:var(--muted)}
.pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--lav);color:var(--violet)}
.pill.cash{background:#FBE3EE;color:#A63D6B}
.pill.hold{background:#FFF4D6;color:#8A6500}

.sim{position:fixed;left:16px;bottom:96px;z-index:45;background:var(--yellow);color:var(--violet-dd);border:0;border-radius:999px;padding:12px 16px;font-weight:800;box-shadow:0 8px 24px rgba(59,37,86,.25);font-size:14px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:60;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:min(92vw,460px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Foto original con zoom lento al cartel */
.zwrap{position:relative;overflow:hidden;height:200px;background:#0b0306}
.zpos{position:absolute;left:0;width:100%;top:50%;transform:translateY(-52%)}
.zpos .photo-fx{transform-origin:74.5% 51%;animation:zoomName 9s ease-in-out infinite alternate}
@keyframes zoomName{0%,12%{transform:scale(1)}88%,100%{transform:scale(1.55)}}
.hero-photo .zwrap{height:110px}
@media(min-width:700px){.zwrap{height:220px}.hero-photo .zwrap{height:200px}}
@media (prefers-reduced-motion:reduce){.zpos .photo-fx{animation:none}}
/* Foto original + destellos en los carteles */
.photo-fx{position:relative;width:100%;aspect-ratio:1170/766;background-size:100% 100%;background-repeat:no-repeat;overflow:hidden}
.show .pic.pfx{height:auto;background:none!important}
.show .pic.pfx::after{display:none}
.show .pic.pfx .grp{background:rgba(20,6,16,.65);padding:4px 10px;border-radius:999px;bottom:10px;left:10px}
.show .pic.pfx .tag{top:10px;left:10px}
.mfx{position:absolute;inset:0;pointer-events:none}
.mfx .gl{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,120,.55),rgba(255,120,90,0));mix-blend-mode:screen;opacity:0;animation:glow var(--d) ease-in-out var(--dl) infinite}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.75}}
.mfx .sp{position:absolute;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fffbe8;box-shadow:0 0 4px 2px rgba(255,236,190,.95),0 0 10px 4px rgba(255,170,120,.55);opacity:0;mix-blend-mode:screen;animation:twk var(--d) ease-in-out var(--dl) infinite}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1.15)}60%{opacity:.85;transform:scale(1)}}
.hero-photo{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(59,37,86,.18)}
.hero-photo-t{margin:8px 2px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.hero-photo-t .chip{order:3}.hero-photo-t h1{font-size:24px;color:var(--violet-d)}.hero-photo-t p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}
@media (prefers-reduced-motion:reduce){.mfx .gl,.mfx .sp{animation:none;opacity:0}}
/* Zoom lento al cartel (sumado a los destellos) */
.zwrap{position:relative;overflow:hidden;height:200px;background:#0b0306}
.zpos{position:absolute;left:0;width:100%;top:50%;transform:translateY(-52%)}
.zpos .photo-fx{transform-origin:74.5% 51%;animation:zoomName 10s ease-in-out infinite alternate}
@keyframes zoomName{0%,10%{transform:scale(1)}90%,100%{transform:scale(1.5)}}
.hero-photo .zwrap{height:110px}
@media(min-width:700px){.zwrap{height:230px}.hero-photo .zwrap{height:200px}}
@media (prefers-reduced-motion:reduce){.zpos .photo-fx{animation:none}}

@keyframes spin{to{transform:rotate(360deg)}}
.show .pic.fx{height:auto;aspect-ratio:900/589;max-height:260px;background:#1a0006!important}
.show .pic.fx .kbpos{top:50%;transform:translateY(-50%)}
.hero .kbpos{top:50%;transform:translateY(-38%)}
@media (prefers-reduced-motion:reduce){.kb,.mill{animation:none}}
/* Luces de marquesina */
.lights{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.lights .sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3c4;box-shadow:0 0 10px 4px rgba(255,205,110,.85);opacity:0;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.marq{position:absolute;left:6px;right:6px;height:12px;display:flex;justify-content:space-between;align-items:center}
.marq.t{top:3px}.marq.b{bottom:3px}
.marq i{width:7px;height:7px;border-radius:50%;background:#ffd76a;box-shadow:0 0 8px 3px rgba(255,195,80,.9);animation:chase 1s steps(1) infinite}
.marq i:nth-child(odd){animation-delay:.5s}
@keyframes chase{0%{opacity:1}50%{opacity:.12;box-shadow:none}}
.show .pic .grp{bottom:20px}.show .pic .tag{top:20px}
.hero .kbpos{z-index:0}.hero .lights{z-index:1}.hero .in{z-index:2}
@media (prefers-reduced-motion:reduce){.lights .sp,.marq i{animation:none;opacity:.9}}
@media(max-width:600px){.hide-sm{display:none}}
@media(max-width:440px){.brand{display:none}.top-in{justify-content:space-between}}
.panel.compact{padding:14px}.panel.compact h2{margin-bottom:10px}.panel.compact .func{padding:10px 12px}.panel.compact .func .cal{width:54px;padding:5px 0}
.backlink{margin-bottom:4px}
/* ===== Panel de la productora: boletería ===== */
.bx{--plum:#2B1640;--velvet:#5B3E7E;--amber:#F2B544;--rose:#D9719A;--paper:#FFFFFF;--lilac:#EFE9F8}
.bx-shows{display:flex;gap:18px;margin:4px 2px 10px;overflow-x:auto}
.bx-shows button{border:0;background:none;padding:6px 0;font-family:Fredoka;font-size:20px;color:#9C8DB4;border-bottom:3px solid transparent;white-space:nowrap}
.bx-shows button.on{color:var(--plum);border-bottom-color:var(--amber)}
.bx-stubs{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stub{position:relative;border:0;background:var(--lilac);color:var(--velvet);padding:9px 18px 9px 22px;font-weight:800;font-size:14px;border-radius:6px;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 7px,#000 7.5px);mask:radial-gradient(circle at 0 50%,transparent 7px,#000 7.5px)}
.stub.on{background:var(--velvet);color:#fff}
.bx-hero{background:var(--plum);color:#F4EEFB;border-radius:20px;padding:22px 20px 18px;display:grid;gap:18px;position:relative;overflow:hidden}
@media(min-width:860px){.bx-hero{grid-template-columns:1fr 1.15fr;align-items:center;padding:28px}}
.bx-hero .when{font-size:15px;color:#C9B8E3;margin:0 0 6px}
.bx-hero h2{font-family:Fredoka;font-weight:600;font-size:clamp(28px,6vw,40px);line-height:1.08;color:#fff;margin:0 0 12px}
.bx-hero .detail{font-size:16px;line-height:1.5;color:#DCCFF0;margin:0;max-width:34ch}
.bx-hero .detail b{color:#fff}
.bx-hero .door-n{margin-top:12px;font-size:15px;color:var(--amber);font-weight:700}
.house{--h:6px;background:#1E0F2E;border-radius:14px;padding:12px 10px 10px}
.house .stg{height:5px;width:60%;margin:0 auto 10px;border-radius:0 0 8px 8px;background:#4A2F66}
.house .hr{display:flex;justify-content:center;gap:2px;margin-bottom:2px}
.house .hr i{width:var(--h);height:var(--h);border-radius:2px;background:#3A2752}
.house .hr i.o{background:var(--amber);box-shadow:0 0 4px rgba(242,181,68,.55)}
.house .hr i.c{background:var(--rose)}
.house .hr i.w{background:#FFF1C9;animation:pulse 1s ease-in-out infinite}
.house .hr i.in{background:#7FE0B0}
.house .gap{width:calc(var(--h) * 1.6)}
.house .key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:#C9B8E3}
.house .key span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--k)}
.bx-grid{display:grid;gap:16px;margin-top:16px}
@media(min-width:860px){.house{--h:9px;padding:16px}}
@media(min-width:860px){.bx-grid{grid-template-columns:1fr 1fr 1.1fr}}
.sheet{background:var(--paper);border-radius:14px;padding:18px;border:1px solid #E6DEF2}
.sheet h3{font-family:Fredoka;font-size:20px;color:var(--plum);margin:0 0 4px}
.sheet .lead{font-size:14px;color:var(--muted);margin:0 0 12px}
.ledger{list-style:none;margin:0;padding:0;font-size:15px}
.ledger li{display:flex;align-items:baseline;gap:8px;padding:6px 0}
.ledger li .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger li .dots{flex:1;border-bottom:2px dotted #CFC3E2;transform:translateY(-4px);min-width:12px}
.ledger li .v{font-variant-numeric:tabular-nums;font-weight:800;color:var(--plum);white-space:nowrap}
.ledger li.tot{border-top:2px solid var(--plum);margin-top:6px;padding-top:10px;font-size:17px}
.ledger li .n2{color:var(--muted);font-weight:600;font-size:13px}
.tape{position:relative}
.tape::after{content:"";position:absolute;left:10px;right:10px;bottom:-7px;height:8px;background:radial-gradient(circle at 6px 0,#fff 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #F0EAF7;font-size:14px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log .k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--amber)}
.log .k.c{background:var(--rose)}.log .k.w{background:#E6D9A8}.log .k.in{background:#2E9E6A}
.cash-sheet{margin-top:16px}
/* ===== Puerta ===== */
.door{background:#1C0E2B;color:#F4EEFB;border-radius:22px;padding:18px;min-height:70vh}
.door h2{font-family:Fredoka;font-size:26px;color:#fff;margin:0}
.door .sub2{color:#C9B8E3;font-size:15px;margin:4px 0 14px}
.door .bx-stubs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.door .stub{background:#3A2752;color:#E4D8F5;white-space:nowrap;flex:none}
.door .stub.on{background:var(--yellow);color:#24163a}
.count{display:flex;align-items:baseline;gap:10px;margin:6px 0 16px}
.count b{font-family:Fredoka;font-size:44px;color:var(--yellow);line-height:1}
.count span{color:#C9B8E3;font-size:16px}
.count .meter{flex:1;height:8px;border-radius:6px;background:#3A2752;overflow:hidden;align-self:center}
.count .meter i{display:block;height:100%;background:#7FE0B0;transition:width .4s}
.scan{position:relative;border-radius:18px;overflow:hidden;background:#2A1A3D;aspect-ratio:4/3;display:grid;place-items:center;margin-bottom:16px}
.scan video{width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;inset:18%;border:3px solid rgba(245,195,59,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(28,14,43,.35)}
.scan .go{border:0;background:var(--yellow);color:#24163a;font-weight:800;font-size:18px;padding:16px 22px;border-radius:999px}
.scan .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:14px;color:#E4D8F5}
.result{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(20,8,30,.55);animation:pop .2s ease-out}
.result .card{width:min(92vw,420px);border-radius:24px;padding:28px 22px;text-align:center;color:#fff}
.result.ok .card{background:#1F8A57}.result.bad .card{background:#C23B53}.result.warn .card{background:#E0A21A;color:#2A1A00}
.result .ic{font-size:64px;line-height:1}
.result h3{font-family:Fredoka;font-size:34px;margin:8px 0 4px}
.result .rseat{font-family:Fredoka;font-size:28px;margin:6px 0}
.result p{margin:6px 0 0;font-size:16px;opacity:.95}
.result small{display:block;margin-top:16px;font-size:13px;opacity:.8}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.try{background:#2A1A3D;border-radius:16px;padding:14px}
.try h3{font-family:Fredoka;font-size:18px;color:#fff;margin:0 0 4px}
.try p{color:#C9B8E3;font-size:14px;margin:0 0 10px}
.try .row2{display:flex;flex-wrap:wrap;gap:8px}
.try .row2 button{border:1px solid #4A3466;background:#341F4C;color:#F4EEFB;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;text-align:left}
.try .row2 button small{display:block;color:#B9A6D6;font-weight:600;font-size:12px}
.try .inp{background:#1C0E2B;border-color:#4A3466;color:#fff}
@media (prefers-reduced-motion:reduce){.house .hr i.w{animation:none}}

footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 8px}
footer b{color:var(--violet)}
@media(max-width:600px){.sim{left:12px!important}.brand small{display:none}.brand b{font-size:15px}.switch button{padding:7px 10px}.hero h1{font-size:28px}.sim{bottom:92px;padding:9px 13px;font-size:13px}}
</style>

const ROWS='ABCDEFGHIJKLMNOPQRST'.split('');
const S1=new Set('ABCDEFGHIJK'.split(''));
function seatsPerSide(r){return 'ABC'.includes(r)?12:14}
// left side shows odd numbers descending toward the aisle (27..1), right side even (2..28)
function leftNums(r){const n=seatsPerSide(r),a=[];for(let i=n;i>=1;i--)a.push(2*i-1);return a}
function rightNums(r){const n=seatsPerSide(r),a=[];for(let i=1;i<=n;i++)a.push(2*i);return a}

/* ============ Estado ============ */
const state={view:'buyer',screen:'home',show:null,func:null,sel:[],held:false,holdEnd:0,form:{email:'',tel:'',artist:''},tickets:[],adminShow:'moulin-rouge',adminFunc:'f1',adminPick:[],cash:{email:'',tel:'',artist:''},feed:[]};
const seatState={}; // funcId -> {key:{st,artist,how}}
let rng=7;function rnd(){rng=(rng*16807)%2147483647;return (rng-1)/2147483646}
function initSeats(){
  SHOWS.forEach(show=>show.funcs.forEach((f,fi)=>{
    const m={};
    ROWS.forEach((r,ri)=>{[...leftNums(r),...rightNums(r)].forEach(n=>{
      const k=r+'-'+n; let st='free',how=null;
      const center=1-Math.min(n,30)/30;
      if(S1.has(r)){const p=(fi?0.30:0.42)*(1-ri/14)+center*0.22; if(rnd()<p){st='sold';how='online'}}
      else {if(rnd()<(fi?0.12:0.2)){st='cash';how='efectivo'}}
      m[k]={st,how,artist:st!=='free'?show.cast[Math.floor(rnd()*show.cast.length)]:null};
    })});
    seatState[f.id]=m;
  }));
}
function ticketOf(fid,k){const s=seatState[fid][k];
  if(!s.code){s.code=String(1000+Math.floor(Math.random()*9000));s.token=Array.from({length:16},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('')}
  return s}
function qrPayload(fid,k){const s=ticketOf(fid,k);return `MM1|${fid}|${k}|${s.token}`}
function showOfFunc(fid){return SHOWS.find(s=>s.funcs.some(f=>f.id===fid))}

/* Movimiento de otros compradores (simulado): butacas que se ponen en espera y luego se venden o se liberan */
const ambient=[];
function ambientHold(fid){
  const m=seatState[fid];const busy=new Set([...(state.func===fid?state.sel:[]),...(state.adminFunc===fid?state.adminPick:[])]);
  const free=Object.keys(m).filter(k=>m[k].st==='free'&&S1.has(k[0])&&!busy.has(k));if(!free.length)return[];
  const start=free[Math.floor(Math.random()*free.length)];const [r,n]=start.split('-');const keys=[start];
  const want=1+Math.floor(Math.random()*3);[+n+2,+n+4].forEach(x=>{const k=r+'-'+x;if(keys.length<want&&m[k]&&m[k].st==='free'&&!busy.has(k))keys.push(k)});
  keys.forEach(k=>{m[k].st='hold';m[k].owner='amb'});
  ambient.push({fid,keys,until:Date.now()+8000+Math.random()*14000});return keys;
}
SHOWS.forEach(s=>s.funcs.forEach(f=>{for(let i=0;i<3;i++)ambientHold(f.id)}));
setInterval(()=>{
  const now=Date.now();const touched={};
  for(let i=ambient.length-1;i>=0;i--){const a=ambient[i];if(a.until>now)continue;

    a.keys.forEach(k=>{if(m[k].st==='hold'&&m[k].owner==='amb'){if(sold){m[k].st='sold';m[k].how='online';m[k].artist=art}else{m[k].st='free';m[k].owner=null}}});

    (touched[a.fid]=touched[a.fid]||[]).push(...a.keys);ambient.splice(i,1);}
  const all=SHOWS.flatMap(s=>s.funcs.map(f=>f.id));
  const fid=Math.random()<0.7&&(state.func||state.adminFunc)?(state.view==='admin'?state.adminFunc:(state.func||all[0])):all[Math.floor(Math.random()*all.length)];

function liveRefreshFor(fid,keys){
  if(state.view==='door')return;
  if(state.view==='admin'){if(fid!==state.adminFunc)return;
    if(state.adminPick.length){keys.forEach(k=>document.querySelectorAll(`#map-admin .seat[data-k="${k}"]`).forEach(()=>refreshSeat(k)));return}

function stats(fid){

/* Reserva atómica (simula la RPC de Postgres) */
function reserveAtomic(fid,keys,owner){
  const m=seatState[fid];
  const blocked=keys.filter(k=>m[k].st!=='free');
  if(blocked.length)return {ok:false,blocked};
  keys.forEach(k=>{m[k].st=owner==='me'?'held':'hold';m[k].owner=owner});
  return {ok:true};
}

  return Object.keys(by).sort().map(r=>{const ns=by[r].sort((a,b)=>a-b);const txt=ns.length>1?ns.slice(0,-1).join(', ')+' y '+ns[ns.length-1]:ns[0];return `Fila ${r}: butaca${ns.length>1?'s':''} ${txt}`}).join(' · ');
}

  const m=seatState[fid];
  const cell=k=>{const s=m[k];const c=s.in?'in':s.st==='sold'?'o':s.st==='cash'?'c':(s.st==='hold'||s.st==='held')?'w':'';return `<i class="${c}"></i>`};
  return `<div class="house" aria-label="Estado de la sala"><div class="stg"></div>${ROWS.map(r=>`<div class="hr">${leftNums(r).map(n=>cell(r+'-'+n)).join('')}<span class="gap"></span>${rightNums(r).map(n=>cell(r+'-'+n)).join('')}</div>`).join('')}
  <div class="key"><span style="--k:var(--amber)">Online</span><span style="--k:var(--rose)">Efectivo</span><span style="--k:#FFF1C9">Pagando ahora</span><span style="--k:#7FE0B0">Ya en la sala</span><span style="--k:#3A2752">Libre</span></div></div>`;
}
function renderAdmin(){
  const s=SHOWS.find(x=>x.id===state.adminShow);if(!s.funcs.some(x=>x.id===state.adminFunc))state.adminFunc=s.funcs[0].id;const fid=state.adminFunc;const f=s.funcs.find(x=>x.id===fid);const st=stats(fid);
  const taken=st.sold+st.cash, free=st.cap-taken-st.hold;
  const inside=Object.values(seatState[fid]).filter(x=>x.in).length;
  const arts=Object.entries(st.art).sort((a,b)=>b[1]-a[1]);
  const pickTotal=state.adminPick.reduce((a,k)=>a+priceOf(k),0);
  const headline=free<=0?`La sala del ${dayName(f)} está llena.`:`Quedan ${free} butacas libres para el ${dayName(f)}.`;
  const kinds={online:['o','Venta online'],efectivo:['c','Efectivo en la escuela'],espera:['w','Pagando'],ingreso:['in','Ingresó']};
  return `<div class="bx">
  <div class="bx-shows" role="tablist">${SHOWS.map(x=>`<button class="${x.id===s.id?'on':''}" onclick="state.adminShow='${x.id}';state.adminPick=[];render()">${x.title}</button>`).join('')}</div>
  <div class="bx-stubs">${s.funcs.map(x=>`<button class="stub ${x.id===fid?'on':''}" onclick="state.adminFunc='${x.id}';state.adminPick=[];render()">${x.dow} ${x.day} de ${x.mon.toLowerCase()}, ${x.time}</button>`).join('')}</div>
  <section class="bx-hero">
    <div><p class="when">${s.group}, ${dayName(f)} ${f.day} a las ${f.time}</p>
      <h2>${headline}</h2>
      <p class="detail">Vendidas <b>${taken}</b> de ${st.cap}: ${st.sold} por Mercado Pago y ${st.cash} en efectivo. ${st.hold?`Ahora mismo ${st.hold} ${st.hold===1?'butaca está':'butacas están'} en proceso de pago.`:''}</p>
      ${inside?`<p class="door-n">Ya ingresaron ${inside} ${inside===1?'persona':'personas'} por la puerta.</p>`:''}
    </div>
    ${houseHTML(fid)}
  </section>
  <div class="bx-grid">
    <div class="sheet tape"><h3>Caja de la función</h3><p class="lead">Lo recaudado hasta ahora.</p>
      <ul class="ledger">
        <li><span class="nm">Mercado Pago <span class="n2">(${st.sold})</span></span><span class="dots"></span><span class="v">${fmt(st.rev)}</span></li>
        <li><span class="nm">Efectivo <span class="n2">(${st.cash})</span></span><span class="dots"></span><span class="v">${fmt(st.revCash)}</span></li>
        <li class="tot"><span class="nm">Total</span><span class="dots"></span><span class="v">${fmt(st.rev+st.revCash)}</span></li>
      </ul></div>
    <div class="sheet"><h3>Elenco</h3><p class="lead">A quién viene a ver el público.</p>
      <ul class="ledger">${arts.map(([n,c])=>`<li><span class="nm">${n}</span><span class="dots"></span><span class="v">${c}</span></li>`).join('')||'<li>Todavía no hay ventas con artista.</li>'}</ul></div>
    <div class="sheet"><h3>Libro de boletería</h3><p class="lead">Cada movimiento, en vivo.</p>
      <ul class="log">${state.feed.filter(x=>x.fid===fid).slice(0,40).map(x=>{const k=kinds[x.how]||['o',x.how];return `<li><time>${x.t.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})}</time><span><span class="k ${k[0]}"></span>${k[1]}: ${x.txt}</span></li>`}).join('')||'<li><time></time><span>Los movimientos aparecen acá apenas suceden.</span></li>'}</ul></div>
  </div>
  <div class="sheet cash-sheet"><h3>Venta en efectivo</h3><p class="lead">Para lo que se cobra en la escuela: tocá las butacas, cargá el email del comprador y registrá el cobro. Quedan bloqueadas al instante para la venta online.</p>
      <div class="zoom"><button onclick="fitAll()" style="font-size:13px">Ver todo</button><button onclick="zoom(-1)" aria-label="Alejar">−</button><button onclick="zoom(1)" aria-label="Acercar">+</button></div><div class="mapwrap" id="mapwrap">${mapHTML('admin')}</div>
      ${state.adminPick.length?`<div class="recap"><div><span>${seatsLabel(state.adminPick)}</span><span>${fmt(pickTotal)}</span></div>
      <label class="f" style="margin-top:6px">Email del comprador <small>(ahí le llegan las entradas)</small></label><input class="inp" id="cashEmail" type="email" inputmode="email" placeholder="comprador@email.com" value="${state.cash.email}" oninput="state.cash.email=this.value">
      <label class="f">Teléfono <small>(WhatsApp, opcional)</small></label><input class="inp" id="cashTel" type="tel" inputmode="tel" placeholder="11 5555 5555" value="${state.cash.tel}" oninput="state.cash.tel=this.value">
      <label class="f">¿A qué artista viene a ver?</label><select class="inp" id="admArtist" onchange="state.cash.artist=this.value"><option value="">Sin especificar</option>${s.cast.map(a=>`<option ${state.cash.artist===a?'selected':''}>${a}</option>`).join('')}</select>
      <button class="btn y full" style="margin-top:12px" onclick="registerCash()">Registrar cobro</button></div>`:''}
  </div></div>${footer()}`;
}

/* ============ Puerta: control de acceso ============ */
function doorFuncs(){return SHOWS.flatMap(s=>s.funcs.map(f=>({s,f})))}
function seatTxt(k){return `Fila ${k.split('-')[0]}, butaca ${k.split('-')[1]}`}
function renderDoor(){
  if(!state.doorFunc)state.doorFunc=SHOWS[0].funcs[0].id;
  const fid=state.doorFunc;const sh=showOfFunc(fid);const m=seatState[fid];
  const sold=Object.keys(m).filter(k=>m[k].st==='sold'||m[k].st==='cash');const inside=sold.filter(k=>m[k].in).length;
  const mine=(state.myTickets||[]);
  const sample=sold.filter(k=>!m[k].in).slice(0,3).map(k=>({fid,k}));
  const used=sold.find(k=>m[k].in);
  const other=doorFuncs().find(x=>x.f.id!==fid);const oth=other&&Object.keys(seatState[other.f.id]).find(k=>seatState[other.f.id][k].st==='sold');
  const tries=[...mine.map(t=>({fid:t.fid,k:t.k,lbl:'Tu entrada'})),...sample.map(x=>({...x,lbl:'Entrada vendida'})),...(used?[{fid,k:used,lbl:'Ya usada'}]:[]),...(oth?[{fid:other.f.id,k:oth,lbl:'De otra función'}]:[])];
  const q=(state.doorQuery||'').trim();
  const found=q.length>=3?sold.filter(k=>ticketOf(fid,k).code.startsWith(q)||(m[k].email||'').includes(q.toLowerCase())||k.replace('-','').toLowerCase()===q.toLowerCase()).slice(0,6):[];
  return `<div class="door">
    <h2>Control de acceso</h2><p class="sub2">Elegí la función de hoy y escaneá las entradas.</p>
    <div class="bx-stubs">${doorFuncs().map(({s,f:x})=>`<button class="stub ${x.id===fid?'on':''}" onclick="state.doorFunc='${x.id}';state.doorQuery='';render()">${s.title}, ${x.dow} ${x.day}</button>`).join('')}</div>
    <div class="count"><b>${inside}</b><span>de ${sold.length} adentro</span><div class="meter"><i style="width:${sold.length?Math.round(inside/sold.length*100):0}%"></i></div></div>
    <div class="scan" id="scan">${state.cam?`<video id="vid" playsinline muted></video><div class="frame"></div><div class="hint">Apuntá al QR de la entrada</div>`:`<button class="go" onclick="startCam()">📷 Escanear con la cámara</button>`}</div>
    ${state.cam?`<button class="btn ghost full" style="margin:-6px 0 16px" onclick="stopCam();render()">Cerrar cámara</button>`:''}
    <div class="try"><h3>Probar sin cámara</h3><p>Tocá una entrada para simular que la escaneás.</p>
      <div class="row2">${tries.map(x=>{const fl=showOfFunc(x.fid).funcs.find(y=>y.id===x.fid);return `<button onclick="checkTicket('${qrPayload(x.fid,x.k)}')">${seatTxt(x.k)}<small>${x.lbl}, ${fl.dow} ${fl.day}</small></button>`}).join('')}</div>
      <label class="f" style="color:#E4D8F5">¿No tiene el QR? Buscá por código, email o butaca (por ejemplo H12)</label>
      <input class="inp" id="doorQ" placeholder="Código de 4 dígitos, email o butaca" value="${q}" oninput="doorSearch(this)">
      <div id="doorFound">${doorFoundHTML(fid,q,found)}</div>
    </div></div>`;
}
function doorFoundHTML(fid,q,found){const m=seatState[fid];
  if(found.length)return `<div class="row2" style="margin-top:10px">${found.map(k=>`<button onclick="checkTicket('${qrPayload(fid,k)}')">${seatTxt(k)}<small>Código ${ticketOf(fid,k).code}${m[k].email?', '+m[k].email:''}</small></button>`).join('')}</div>`;
  return q.length>=3?'<p style="margin-top:10px">No hay entradas que coincidan en esta función.</p>':'';
}
function doorSearch(el){state.doorQuery=el.value;const fid=state.doorFunc;const m=seatState[fid];const q=el.value.trim();
  const sold=Object.keys(m).filter(k=>m[k].st==='sold'||m[k].st==='cash');
  const found=q.length>=3?sold.filter(k=>ticketOf(fid,k).code.startsWith(q)||(m[k].email||'').includes(q.toLowerCase())||k.replace('-','').toLowerCase()===q.toLowerCase()).slice(0,6):[];
  $('#doorFound').innerHTML=doorFoundHTML(fid,q,found);
}
function checkTicket(payload){
  const [v,fid,k,tok]=String(payload).split('|');let res;
  const cur=state.doorFunc;
  if(v!=='MM1'||!seatState[fid]||!seatState[fid][k]){res={c:'bad',ic:'✕',h:'Entrada no válida',p:'Este código no corresponde a ninguna entrada.'}}
  else{const s=seatState[fid][k];const sh=showOfFunc(fid);const fl=sh.funcs.find(x=>x.id===fid);
    if(!(s.st==='sold'||s.st==='cash')||s.token!==tok)res={c:'bad',ic:'✕',h:'Entrada no válida',p:'El código no coincide con una entrada vendida.'};
    else if(fid!==cur)res={c:'warn',ic:'!',h:'Es para otra función',seat:seatTxt(k),p:`Esta entrada es para ${sh.title}, ${fl.dow} ${fl.day} a las ${fl.time}.`};
    else if(s.in)res={c:'bad',ic:'✕',h:'Ya ingresó',seat:seatTxt(k),p:`Esta entrada se usó a las ${s.in.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}.`};
    else{s.in=new Date();state.feed.unshift({t:new Date(),fid,txt:seatTxt(k),how:'ingreso',amt:0});
      res={c:'ok',ic:'✓',h:'¡Bienvenido!',seat:seatTxt(k),p:S1.has(k[0])?'Platea, sector 1':'Sector 2'}}
  }
  showResult(res);
}
function showResult(r){
  const el=document.createElement('div');el.className='result '+r.c;el.setAttribute('role','alert');
  el.innerHTML=`<div class="card"><div class="ic">${r.ic}</div><h3>${r.h}</h3>${r.seat?`<div class="rseat">${r.seat}</div>`:''}<p>${r.p}</p><small>Tocá para seguir</small></div>`;
  const close=()=>{if(!el.isConnected)return;el.remove();state.scanPause=false;
    if(state.view==='door'){if(state.cam){const c=document.querySelector('.count');if(c){const tmp=document.createElement('div');tmp.innerHTML=renderDoor();c.replaceWith(tmp.querySelector('.count'))}}else render()}};
  el.onclick=close;document.body.appendChild(el);setTimeout(close,3200);
  try{navigator.vibrate&&navigator.vibrate(r.c==='ok'?80:[60,60,60])}catch(e){}
}
let camStream=null,camLoop=0;
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este navegador no permite usar la cámara acá. Probá con las entradas de abajo.');return}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
  catch(e){toast('No se pudo abrir la cámara. Revisá el permiso del navegador o probá con las entradas de abajo.',4500);return}
  state.cam=true;render();const v=document.getElementById('vid');v.srcObject=camStream;await v.play().catch(()=>{});
  const cv=document.createElement('canvas');const ctx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{if(!state.cam)return;const vv=document.getElementById('vid');
    if(vv&&vv.readyState>=2&&!state.scanPause){cv.width=vv.videoWidth;cv.height=vv.videoHeight;ctx.drawImage(vv,0,0);
      const img=ctx.getImageData(0,0,cv.width,cv.height);const code=window.jsQR&&jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(code&&code.data){state.scanPause=true;checkTicket(code.data)}}
    camLoop=requestAnimationFrame(tick)};
  tick();
}
function stopCam(){state.cam=false;cancelAnimationFrame(camLoop);if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}

function afterAdmin(){if(!$('#mapwrap'))return;if(mapScale===null)mapScale=fitTo('map-admin');else $('#map-admin').style.setProperty('--s',mapScale+'px')}
function adminSeat(k){const i=state.adminPick.indexOf(k);if(i>=0)state.adminPick.splice(i,1);else state.adminPick.push(k);
  const sc=window.scrollY,ms=$('#mapwrap')?[$('#mapwrap').scrollLeft,$('#mapwrap').scrollTop]:null;render();window.scrollTo(0,sc);if(ms){$('#mapwrap').scrollLeft=ms[0];$('#mapwrap').scrollTop=ms[1]}}
function registerCash(){
  const fid=state.adminFunc;const art=state.cash.artist||null;const keys=[...state.adminPick];
  const email=state.cash.email.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){toast('📧 Cargá el email del comprador para enviarle las entradas.');const el=$('#cashEmail');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el.focus(),350)}return}
  const m=seatState[fid];const blocked=keys.filter(k=>m[k].st!=='free');
  if(blocked.length){toast(`La butaca ${blocked.join(', ')} ya no está libre.`);state.adminPick=state.adminPick.filter(k=>!blocked.includes(k));render();return}
  keys.forEach(k=>{m[k].st='cash';m[k].how='efectivo';m[k].artist=art});
  keys.forEach(k=>{m[k].email=email;ticketOf(fid,k)});
  state.feed.unshift({t:new Date(),fid,txt:`${keys.length} entrada(s) · ${keys.map(k=>k.replace('-',' ')).join(', ')} · ${email}`,how:'efectivo',amt:keys.reduce((a,k)=>a+priceOf(k),0)});
  state.adminPick=[];state.cash={email:'',tel:'',artist:''};toast(`✅ Cobro registrado. Entradas con QR enviadas a ${email}.`,4200);render();
}

/* ============ Simulador de otro comprador ============ */
function simulateBuyer(){
  const fid=state.view==='buyer'&&state.func?state.func:state.adminFunc;
  const m=seatState[fid];
  // Si estás eligiendo butacas (sin reservar todavía), el otro comprador intenta tomar una de las tuyas
  let target=[];
  if(state.view==='buyer'&&state.screen==='seats'&&state.func===fid&&state.sel.length&&!state.held){
    target=[state.sel[0]];
  }else{
    const free=Object.keys(m).filter(k=>m[k].st==='free'&&S1.has(k[0])&&!state.sel.includes(k));
    if(!free.length){toast('¡Función agotada online!');return}
    const start=free[Math.floor(Math.random()*free.length)];const [r,n]=start.split('-');const num=+n;
    target=[start];[num+2,num+4].forEach(x=>{const k=r+'-'+x;if(m[k]&&m[k].st==='free'&&!state.sel.includes(k)&&target.length<1+Math.floor(Math.random()*3))target.push(k)});
  }
  if(state.held&&state.func===fid&&target.some(k=>state.sel.includes(k))){toast('🛡️ Otro comprador intentó tomar tu butaca, pero está reservada para vos.');return}
  const res=reserveAtomic(fid,target,'sim');
  if(!res.ok){toast('Otro comprador intentó una butaca ocupada: el sistema lo rechazó.');return}
  const stolen=target.filter(k=>state.sel.includes(k));
  if(stolen.length){stolen.forEach(k=>state.sel.splice(state.sel.indexOf(k),1));
    toast(`😬 Otra persona reservó la ${stolen.map(k=>'fila '+k.split('-')[0]+', butaca '+k.split('-')[1]).join(' y la ')} un instante antes que vos. El sistema nunca vende la misma butaca dos veces.`,5500)}
  else toast(`🎭 Alguien está comprando ${target.map(k=>k.replace('-',' ')).join(', ')} · quedan "en espera" mientras paga`);
  state.feed.unshift({t:new Date(),fid,txt:`Reserva · ${target.map(k=>k.replace('-',' ')).join(', ')}`,how:'espera',amt:0});
  liveRefresh(target);
  setTimeout(()=>{
    const show=showOfFunc(fid);const art=show.cast[Math.floor(Math.random()*show.cast.length)];
    target.forEach(k=>{if(m[k].st==='hold'){m[k].st='sold';m[k].how='online';m[k].artist=art}});
    state.feed.unshift({t:new Date(),fid,txt:`${target.length} entrada(s) · ${target.map(k=>k.replace('-',' ')).join(', ')}`,how:'online',amt:target.reduce((a,k)=>a+priceOf(k),0)});
    liveRefresh(target);
  },7000);
}
function liveRefresh(keys){
  if(state.view==='admin'){const sc=window.scrollY,w=$('#mapwrap'),ms=w?[w.scrollLeft,w.scrollTop]:null;render();window.scrollTo(0,sc);if(ms&&$('#mapwrap')){$('#mapwrap').scrollLeft=ms[0];$('#mapwrap').scrollTop=ms[1]}}
  else if(state.screen==='seats'){keys.forEach(refreshSeat);renderCart()}
  else if(state.screen==='funcs'){render()}
}

/* ============ Inicio / enlace directo ============ */
(function(){const p=new URLSearchParams(location.search).get('show');
  if(p&&SHOWS.some(s=>s.id===p&&!s.soon)){state.show=p;state.screen='funcs'}
  render();
  window.addEventListener('resize',()=>{if(state.screen==='seats'&&state.view==='buyer'){mapScale=null;fitMap()}});
})();
</script>
